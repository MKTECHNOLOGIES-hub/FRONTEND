<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M.K TECH | Mobile Store</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- FIREBASE SDKs (Compat Version for simple HTML single-file use) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .app-screen {
            display: none;
        }
        .app-screen.active {
            display: block;
        }
    </style>
</head>
<body class="text-slate-900 min-h-screen max-w-md mx-auto bg-slate-50 relative pb-20 border-x border-slate-200/60 shadow-sm">

    <!-- APP TOP HEADER -->
    <header class="px-5 pt-5 pb-3 flex items-center justify-between bg-slate-50/90 backdrop-blur-md sticky top-0 z-30 border-b border-slate-100">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-slate-900 text-white font-black flex items-center justify-center text-xs tracking-tighter">
                MK
            </div>
            <h1 class="text-base font-bold text-slate-900 tracking-tight">M.K TECH</h1>
        </div>
        <button onclick="switchTab('cart')" class="relative p-2 rounded-xl text-slate-700 hover:bg-slate-200/50 transition">
            <i data-lucide="shopping-bag" class="w-5 h-5"></i>
            <span id="cartCountBadge" class="hidden absolute top-1 right-1 w-2 h-2 rounded-full bg-slate-900"></span>
        </button>
    </header>

    <!-- ================= SCREENS ================= -->

    <!-- 1. HOME SCREEN -->
    <section id="screen-home" class="app-screen active px-5 py-4 space-y-5">
        <!-- Hero Banner -->
        <div class="w-full bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-3xl p-5 shadow-lg relative overflow-hidden">
            <span class="text-[10px] uppercase font-bold tracking-widest text-slate-400">Featured Store</span>
            <h2 class="text-xl font-extrabold mt-1">Upgrade Your Tech Game ⚡</h2>
            <p class="text-xs text-slate-300 mt-1 max-w-[200px]">Smartwatches, Audio Gear & Action Cameras.</p>
            <button onclick="switchTab('products')" class="mt-4 px-4 py-2 bg-white text-slate-900 rounded-xl text-xs font-bold shadow-md hover:bg-slate-100 transition">
                Explore Shop
            </button>
        </div>

        <!-- Trending Products Horizontal -->
        <div>
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500">Trending Now</h3>
                <button onclick="switchTab('products')" class="text-xs font-semibold text-slate-900">View All</button>
            </div>
            <div id="homeTrendingGrid" class="grid grid-cols-2 gap-3">
                <!-- Loaded from Firestore -->
            </div>
        </div>
    </section>

    <!-- 2. PRODUCTS / SHOP SCREEN -->
    <section id="screen-products" class="app-screen space-y-3">
        <!-- SEARCH BAR -->
        <div class="px-5 pt-3">
            <div class="flex items-center gap-2">
                <div class="relative flex-1">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search gadgets..." 
                        class="w-full bg-slate-100/90 text-xs text-slate-800 placeholder-slate-400 pl-10 pr-4 py-3 rounded-2xl focus:outline-none focus:ring-1 focus:ring-slate-300 transition">
                </div>
            </div>
        </div>

        <!-- CATEGORY PILLS -->
        <div class="px-5 py-2 flex items-center gap-2 overflow-x-auto hide-scrollbar text-xs font-medium">
            <button onclick="filterCategory('all', this)" class="cat-pill active bg-slate-900 text-white px-4 py-2 rounded-xl font-semibold whitespace-nowrap transition">All</button>
            <button onclick="filterCategory('watches', this)" class="cat-pill bg-slate-100 text-slate-600 px-4 py-2 rounded-xl whitespace-nowrap transition">Watches</button>
            <button onclick="filterCategory('earbuds', this)" class="cat-pill bg-slate-100 text-slate-600 px-4 py-2 rounded-xl whitespace-nowrap transition">Earbuds</button>
            <button onclick="filterCategory('cameras', this)" class="cat-pill bg-slate-100 text-slate-600 px-4 py-2 rounded-xl whitespace-nowrap transition">Cameras</button>
            <button onclick="filterCategory('gaming', this)" class="cat-pill bg-slate-100 text-slate-600 px-4 py-2 rounded-xl whitespace-nowrap transition">Gaming</button>
        </div>

        <!-- PRODUCT GRID -->
        <main class="px-5 pb-8">
            <div id="productGrid" class="grid grid-cols-2 gap-3.5">
                <!-- Loaded from Firestore -->
            </div>
        </main>
    </section>

    <!-- 3. CART SCREEN -->
    <section id="screen-cart" class="app-screen px-5 py-4 space-y-4">
        <h2 class="text-base font-bold text-slate-900">Shopping Cart</h2>
        <div id="cartItemsList" class="space-y-3 min-h-[180px]">
            <!-- Dynamic Cart Items -->
        </div>

        <!-- Customer Checkout Info Form -->
        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-xs space-y-3">
            <h3 class="text-xs font-bold text-slate-800 uppercase tracking-wider">Shipping Details</h3>
            <input type="text" id="custName" placeholder="Full Name (e.g., Arain)" class="w-full bg-slate-100 text-xs p-2.5 rounded-xl focus:outline-none">
            <input type="text" id="custPhone" placeholder="Phone Number (e.g., 03001234567)" class="w-full bg-slate-100 text-xs p-2.5 rounded-xl focus:outline-none">
            <input type="email" id="custEmail" placeholder="Email Address" class="w-full bg-slate-100 text-xs p-2.5 rounded-xl focus:outline-none">
            <input type="text" id="custAddress" placeholder="Street Address" class="w-full bg-slate-100 text-xs p-2.5 rounded-xl focus:outline-none">
            <div class="flex gap-2">
                <input type="text" id="custCity" placeholder="City (e.g., Lahore)" class="w-1/2 bg-slate-100 text-xs p-2.5 rounded-xl focus:outline-none">
                <input type="text" id="custPostal" placeholder="Postal Code" class="w-1/2 bg-slate-100 text-xs p-2.5 rounded-xl focus:outline-none">
            </div>
        </div>

        <!-- Payment Method Section (Cash on Delivery) -->
        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-xs space-y-2">
            <h3 class="text-xs font-bold text-slate-800 uppercase tracking-wider">Payment Method</h3>
            <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-200 cursor-pointer">
                <input type="radio" name="paymentMethod" value="COD" checked class="accent-slate-900">
                <div class="text-xs">
                    <p class="font-bold text-slate-900">Cash on Delivery (COD)</p>
                    <p class="text-[10px] text-slate-500">Pay securely when your package arrives at your doorstep.</p>
                </div>
            </label>
        </div>

        <!-- Cart Summary & Firestore Order Checkout -->
        <div class="border-t border-slate-200 pt-3 space-y-3 bg-white p-4 rounded-2xl shadow-xs">
            <div class="flex justify-between text-xs font-semibold">
                <span class="text-slate-500">Subtotal:</span>
                <span id="cartTotalText" class="text-slate-900 font-bold">Rs. 0</span>
            </div>
            <button onclick="submitOrderToFirestore()" class="w-full py-3.5 bg-slate-900 text-white text-xs font-bold rounded-xl hover:bg-slate-800 transition flex items-center justify-center gap-2 shadow-md">
                <i data-lucide="check-circle" class="w-4 h-4"></i> Place Order (Cash on Delivery)
            </button>
        </div>
    </section>

    <!-- 4. PROFILE SCREEN -->
    <section id="screen-profile" class="app-screen px-5 py-6 space-y-4">
        <div class="flex items-center gap-3 p-4 bg-white rounded-2xl shadow-xs border border-slate-100">
            <div class="w-12 h-12 rounded-full bg-slate-900 text-white font-bold flex items-center justify-center text-sm">MK</div>
            <div>
                <h3 class="text-sm font-bold text-slate-900">M.K TECH Store Owner</h3>
                <p class="text-xs text-slate-400">Connected to Firebase Firestore 🚀</p>
            </div>
        </div>
    </section>

    <!-- ================= PRODUCT DETAIL VIEW ================= -->
    <div id="productDetailView" class="fixed inset-0 bg-white z-50 hidden overflow-y-auto">
        <div class="sticky top-0 bg-white/90 backdrop-blur-md px-5 py-4 flex items-center justify-between border-b border-slate-100 z-10">
            <button onclick="closeProductDetail()" class="p-2 -ml-2 rounded-full hover:bg-slate-100 text-slate-700">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>
            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Product Details</span>
            <button onclick="switchTab('cart'); closeProductDetail();" class="p-2 -mr-2 text-slate-700">
                <i data-lucide="shopping-bag" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="px-5 py-4 space-y-4 max-w-md mx-auto pb-24">
            <div class="w-full aspect-square bg-slate-100 rounded-3xl overflow-hidden shadow-inner">
                <img id="d-image" src="" class="w-full h-full object-cover">
            </div>
            <div class="space-y-1">
                <span id="d-category" class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg"></span>
                <h2 id="d-title" class="text-xl font-extrabold text-slate-900 pt-1"></h2>
                <p id="d-price" class="text-lg font-bold text-slate-900"></p>
            </div>
            <hr class="border-slate-100">
            <div>
                <h4 class="text-xs font-bold text-slate-800 uppercase tracking-wider mb-1">Description</h4>
                <p id="d-desc" class="text-xs text-slate-500 leading-relaxed"></p>
            </div>
        </div>

        <div class="fixed bottom-0 inset-x-0 max-w-md mx-auto bg-white/95 backdrop-blur-md p-4 border-t border-slate-100">
            <button id="d-addToCartBtn" class="w-full py-3.5 bg-slate-900 text-white font-bold text-xs rounded-2xl shadow-lg hover:bg-slate-800 transition flex items-center justify-center gap-2">
                <i data-lucide="shopping-cart" class="w-4 h-4"></i> Add to Cart
            </button>
        </div>
    </div>

    <!-- ================= BOTTOM NAVIGATION BAR ================= -->
    <nav class="fixed bottom-0 inset-x-0 max-w-md mx-auto bg-white/90 backdrop-blur-md border-t border-slate-200/80 px-6 py-2.5 flex items-center justify-between z-40">
        <button onclick="switchTab('home')" class="nav-btn active flex flex-col items-center gap-1 text-slate-900" data-tab="home">
            <i data-lucide="home" class="w-5 h-5"></i>
            <span class="text-[10px] font-semibold">Home</span>
        </button>
        <button onclick="switchTab('products')" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-slate-900" data-tab="products">
            <i data-lucide="grid" class="w-5 h-5"></i>
            <span class="text-[10px] font-semibold">Products</span>
        </button>
        <button onclick="switchTab('cart')" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-slate-900 relative" data-tab="cart">
            <i data-lucide="shopping-bag" class="w-5 h-5"></i>
            <span class="text-[10px] font-semibold">Cart</span>
        </button>
        <button onclick="switchTab('profile')" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-slate-900" data-tab="profile">
            <i data-lucide="user" class="w-5 h-5"></i>
            <span class="text-[10px] font-semibold">Profile</span>
        </button>
    </nav>

    <!-- ================= JAVASCRIPT & FIREBASE LOGIC ================= -->
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAVgOscvlM0tcLmkAsKBCciqkC5O3AAIOU",
          authDomain: "mk-tech-3d536.firebaseapp.com",
          projectId: "mk-tech-3d536",
          storageBucket: "mk-tech-3d536.firebasestorage.app",
          messagingSenderId: "419394180062",
          appId: "1:419394180062:web:b59e2536800babf657034f",
          measurementId: "G-SF1YS17QXH"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let products = [];
        let cart = [];
        let activeCategory = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            fetchProductsFromFirestore();
            lucide.createIcons();
        });

        function fetchProductsFromFirestore() {
            db.collection("products").get().then((querySnapshot) => {
                products = [];
                querySnapshot.forEach((doc) => {
                    products.push({ firestoreId: doc.id, ...doc.data() });
                });
                
                if(products.length === 0) {
                    products = [
                        { id: 1, name: 'Series 9 Ultra Watch', category: 'watches', price: 6499, image: 'https://images.unsplash.com/photo-1508685096489-7aacd43bd3b1?auto=format&fit=crop&w=500&q=80', description: 'Ultra Amoled HD display.' },
                        { id: 2, name: 'ANC Pro 2 Earbuds', category: 'earbuds', price: 4199, image: 'https://images.unsplash.com/photo-1590658268037-6bf12165a8df?auto=format&fit=crop&w=500&q=80', description: 'Active Noise Cancellation.' }
                    ];
                }

                renderProducts(products);
                renderHomeTrending();
            }).catch((error) => {
                console.error("Error getting products: ", error);
            });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${tabId}`).classList.add('active');

            document.querySelectorAll('.nav-btn').forEach(b => {
                if (b.dataset.tab === tabId) {
                    b.className = 'nav-btn active flex flex-col items-center gap-1 text-slate-900';
                } else {
                    b.className = 'nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-slate-900';
                }
            });
            window.scrollTo(0,0);
        }

        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            items.forEach(p => {
                const card = `
                    <div onclick="openProductDetail(${p.id})" class="cursor-pointer group">
                        <div class="relative w-full aspect-square bg-slate-100 rounded-2xl overflow-hidden mb-2">
                            <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            <button onclick="event.stopPropagation(); addToCart(${p.id});" class="absolute bottom-2.5 right-2.5 w-7 h-7 rounded-full bg-white/90 backdrop-blur text-slate-800 flex items-center justify-center shadow-xs hover:bg-slate-900 hover:text-white transition">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                        </div>
                        <h3 class="text-xs font-semibold text-slate-800 truncate">${p.name}</h3>
                        <p class="text-[11px] font-bold text-slate-900">Rs. ${p.price.toLocaleString()}</p>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', card);
            });
            lucide.createIcons();
        }

        function renderHomeTrending() {
            const container = document.getElementById('homeTrendingGrid');
            container.innerHTML = '';
            products.slice(0, 4).forEach(p => {
                const card = `
                    <div onclick="openProductDetail(${p.id})" class="cursor-pointer bg-white p-2.5 rounded-2xl border border-slate-100 shadow-xs">
                        <div class="w-full aspect-square bg-slate-100 rounded-xl overflow-hidden mb-2">
                            <img src="${p.image}" class="w-full h-full object-cover">
                        </div>
                        <h4 class="text-xs font-bold text-slate-800 truncate">${p.name}</h4>
                        <p class="text-[11px] font-semibold text-slate-900">Rs. ${p.price.toLocaleString()}</p>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', card);
            });
        }

        function filterCategory(cat, btn) {
            activeCategory = cat;
            document.querySelectorAll('.cat-pill').forEach(b => {
                b.className = 'cat-pill bg-slate-100 text-slate-600 px-4 py-2 rounded-xl whitespace-nowrap transition';
            });
            btn.className = 'cat-pill active bg-slate-900 text-white px-4 py-2 rounded-xl font-semibold whitespace-nowrap transition';

            const filtered = (cat === 'all') ? products : products.filter(p => p.category === cat);
            renderProducts(filtered);
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => 
                (activeCategory === 'all' || p.category === activeCategory) &&
                p.name.toLowerCase().includes(query)
            );
            renderProducts(filtered);
        }

        function openProductDetail(id) {
            const p = products.find(prod => prod.id === id);
            if (!p) return;

            document.getElementById('d-image').src = p.image;
            document.getElementById('d-title').innerText = p.name;
            document.getElementById('d-price').innerText = `Rs. ${p.price.toLocaleString()}`;
            document.getElementById('d-category').innerText = p.category;
            document.getElementById('d-desc').innerText = p.description || 'No description available.';

            document.getElementById('d-addToCartBtn').onclick = () => {
                addToCart(p.id);
                closeProductDetail();
                switchTab('cart');
            };

            document.getElementById('productDetailView').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function closeProductDetail() {
            document.getElementById('productDetailView').classList.add('hidden');
        }

        function addToCart(id) {
            const p = products.find(prod => prod.id === id);
            if (!p) return;
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...p, qty: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const badge = document.getElementById('cartCountBadge');
            const container = document.getElementById('cartItemsList');
            let total = 0;

            if (cart.length > 0) badge.classList.remove('hidden');
            else badge.classList.add('hidden');

            container.innerHTML = '';
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">Your cart is empty</p>`;
            }

            cart.forEach(item => {
                total += item.price * item.qty;
                const html = `
                    <div class="flex items-center justify-between p-3 bg-white rounded-2xl border border-slate-100 shadow-xs text-xs">
                        <div class="flex items-center gap-3">
                            <img src="${item.image}" class="w-10 h-10 rounded-xl object-cover">
                            <div>
                                <p class="font-bold text-slate-800">${item.name}</p>
                                <p class="text-[10px] text-slate-400">Rs. ${item.price.toLocaleString()} x ${item.qty}</p>
                            </div>
                        </div>
                        <span class="font-bold text-slate-900">Rs. ${(item.price * item.qty).toLocaleString()}</span>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });

            document.getElementById('cartTotalText').innerText = `Rs. ${total.toLocaleString()}`;
        }

        // ================= SUBMIT ORDER DIRECTLY TO FIRESTORE WITH COD =================
        function submitOrderToFirestore() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const email = document.getElementById('custEmail').value.trim();
            const address = document.getElementById('custAddress').value.trim();
            const city = document.getElementById('custCity').value.trim();
            const postalCode = document.getElementById('custPostal').value.trim();

            if(!name || !phone || !address || !city) {
                alert("Please fill in your essential shipping details!");
                return;
            }

            const orderId = "MK-" + Math.floor(100000 + Math.random() * 900000);
            
            // Structured Payload with Cash on Delivery info
            const orderPayload = {
                orderId: orderId,
                createdAt: new Date().toISOString(),
                totalAmount: cart.reduce((acc, i) => acc + (i.price * i.qty), 0),
                status: 'pending',
                paymentMethod: 'Cash on Delivery (COD)',
                items: cart.map(i => ({
                    id: i.id,
                    name: i.name,
                    price: i.price,
                    qty: i.qty
                })),
                customerInfo: {
                    name: name,
                    phone: phone,
                    email: email,
                    address: address,
                    city: city,
                    postalCode: postalCode
                }
            };

            // Save to Firestore 'orders' collection
            db.collection("orders").add(orderPayload)
            .then((docRef) => {
                alert(`✅ Order Placed Successfully via Cash on Delivery!\nOrder ID: ${orderId}\nSaved to Firestore DB!`);
                cart = [];
                updateCartUI();
                switchTab('home');
            })
            .catch((error) => {
                console.error("Error adding order: ", error);
                alert("Error placing order. Check console.");
            });
        }
    </script>
</body>
</html>
